[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "sj-customers"
version = "0.1.0"
description = "Customer data processing for Selina Jewellery"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Proprietary"}
authors = [
    {name = "Selina Jewellery"}
]
dependencies = [
    "pandas>=1.3.0",
    "openpyxl>=3.0.7",
    "xlrd>=2.0.1"
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sj_customers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
